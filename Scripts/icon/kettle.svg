<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
  </defs>

  <!-- steam -->
  <g stroke="#B8E3FF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 210 100 C 195 80, 225 60, 210 40" />
    <path d="M 256 100 C 241 80, 271 60, 256 40" />
    <path d="M 302 100 C 287 80, 317 60, 302 40" />
  </g>

  <!-- handle -->
  <path d="M 358 210 C 430 210, 430 320, 358 320"
        fill="none" stroke="url(#body)" stroke-width="26" stroke-linecap="round"/>

  <!-- spout -->
  <path d="M 128 185
           C 95 165, 55 175, 50 205
           C 47 225, 65 232, 82 224
           L 152 250 Z" fill="url(#body)"/>

  <!-- lid -->
  <rect x="190" y="118" width="100" height="26" rx="13" fill="url(#body)"/>
  <circle cx="240" cy="108" r="14" fill="url(#body)"/>

  <!-- body -->
  <path d="M 120 170
           L 360 170
           C 380 170, 392 190, 388 220
           L 366 400
           C 362 428, 340 448, 310 448
           L 170 448
           C 140 448, 118 428, 114 400
           L 92 220
           C 88 190, 100 170, 120 170 Z"
        fill="url(#body)"/>

  <!-- base -->
  <rect x="150" y="452" width="180" height="24" rx="12" fill="#0A6FD1"/>

  <!-- highlight -->
  <path d="M 150 200 C 140 260, 140 340, 160 410"
        stroke="#DFF3FF" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.55"/>
</svg>
